services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      POSTGRES_DB: tickets
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ticket_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: support-ticket-app
    environment:
      DATABASE_URL: postgresql+psycopg://ticket_user:${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}@db:5432/tickets
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ticket_data: