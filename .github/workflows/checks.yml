name: Project checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    name: Test, build, and scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticket_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_test -d tickets_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://ticket_test:local-test-password@localhost:5432/tickets_test
      TEST_DATABASE_URL: postgresql+psycopg://ticket_test:local-test-password@localhost:5432/tickets_test

    steps:
      - name: Download repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run application tests
        run: python -m pytest tests -v

      - name: Build application image
        run: docker build --pull -t support-ticket-app:checks .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: support-ticket-app:checks
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  infrastructure:
    name: Check Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Initialize without connecting to state storage
        run: terraform -chdir=infrastructure init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=infrastructure validate